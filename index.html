<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Retro Footy</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>
    <main id="game-page">

        <!--
            This message only appears on small screens
            being held in portrait orientation.
        -->
        <section
            id="rotate-message"
            aria-label="Landscape orientation required"
        >
            <div>
                <h1>RETRO FOOTY</h1>

                <p>
                    This game is played in landscape mode.
                </p>

                <p>
                    Rotate your phone sideways to continue.
                </p>
            </div>
        </section>

        <!--
            Phaser places the game canvas inside this
            single game-container element.
        -->
        <div id="game-shell">
            <div id="game-container"></div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
